# peaknet_baseline: carbonscott/peaknet PeakNet (ConvNeXtV2 + BiFPN + seg head), 1 binary logit.
# Architecture = peaknet/train/hydra_config/train_config/base.yaml defaults (from scratch, as upstream).
model:
  name: peaknet_baseline
  patch_size: 4          # 2 = stem stride 2, logits at 1/2 res (4x compute)
  hidden_sizes: [96, 192, 384, 768]
  depths: [3, 3, 9, 3]
  drop_path_rate: 0.0
  bifpn_features: 256
  bifpn_blocks: 1
  bifpn_base_level: 4
  head_channels: 256
  head_groups: 32
  uses_learned_upsample: false
  norm: log1p_std        # or "instance" (upstream InstanceNorm on raw ADU)
  clip_max: 65000.0
  pad_multiple: 32
# seg/train.py keys. Upstream PeakNet (base.yaml): AdamW lr 1.5e-4, wd 0.05, clip 1.0, focal alpha [0.25,0.75] gamma 2.
# Here: lr 3e-4 for a short from-scratch run; focal (alpha 0.75 on peaks) x10 + dice.
train:
  crop: 512
  batch_size: 16
  crops_per_image: 4
  pos_frac: 0.8
  lr: 3.0e-4
  weight_decay: 0.05
  warmup: 300
  grad_clip: 1.0
  amp: true
  num_workers: 8
  val_every: 1000
  val_images: 200
loss:
  type: focal_dice
  focal_alpha: 0.75
  focal_gamma: 2.0
  w_main: 10.0
  w_dice: 1.0
