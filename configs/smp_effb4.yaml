# best_model ensemble member (h1): smp Unet(efficientnet-b4, ImageNet via smp-hub) full-res decoder.
# Same recipe as h7 configs/smp_unet.yaml (smp_r34_a, val peak F1 .917), different encoder family for diversity.
model: {arch: Unet, encoder: efficientnet-b4, weights: imagenet, encoder_lr_mult: 1.0}
train: {crop: 512, batch_size: 16, crops_per_image: 4, pos_frac: 0.8, lr: 5.0e-4, weight_decay: 1.0e-4,
        max_steps: 30000, warmup: 300, val_every: 1000, val_images: 150, num_workers: 8, amp: true,
        grad_clip: 1.0, gain_jitter: 0.2, rot90: true,
        thresholds: [0.5, 0.7, 0.8, 0.9, 0.95, 0.97, 0.98, 0.99, 0.995, 0.998]}
loss: {type: focal_dice, focal_alpha: 0.25, focal_gamma: 2.0, w_main: 10.0, w_dice: 1.0}
