# lucid_unet: lucidrains x-unet (XUnet 2D), binary peak logit. See seg/models/lucid_unet.py.
# Train: python -m seg.train --model lucid_unet --config configs/lucid_unet.yaml --out <rundir> --time-min N
model:
  name: lucid_unet
  dim: 32
  dim_mults: [1, 2, 4, 8]
  num_blocks_per_stage: [2, 2, 2, 2]
  num_self_attn_per_stage: [0, 0, 0, 1]
  nested_unet_depths: [0, 0, 0, 0]
  consolidate_upsample_fmaps: true
  use_convnext: false
  attn_heads: 8
  attn_dim_head: 32
  sdpa_attention: true
  pad_multiple: 32
  norm_scale: 32.0
  norm_div: 3.0
  init_prior: 0.01
train:
  crop: 512
  batch_size: 6
  crops_per_image: 4
  pos_frac: 0.8
  lr: 6.0e-4
  weight_decay: 0.01
  max_steps: 20000
  warmup: 300
  val_every: 1000
  val_images: 200
  num_workers: 4
  amp: true
  grad_clip: 1.0
  gain_jitter: 0.2
  rot90: true
  val_tile: 1024
  seed: 0
  thresholds: [0.3, 0.5, 0.7, 0.8, 0.9, 0.95, 0.97, 0.98, 0.99, 0.995, 0.998]
loss:
  type: focal_dice
  focal_alpha: 0.25
  focal_gamma: 2.0
