# lucidrains segformer-pytorch, trained from scratch, 1-channel input, PixelShuffle(4) full-res head.
model:
  dims: [32, 64, 160, 256]
  heads: [1, 2, 5, 8]
  ff_expansion: [8, 8, 4, 4]
  reduction_ratio: [8, 4, 2, 1]
  num_layers: 2
  decoder_dim: 256
  refine: true
  refine_ch: 16
  prior: 0.01
train:
  crop: 512
  batch_size: 16
  crops_per_image: 4
  pos_frac: 0.7
  lr: 6.0e-4
  weight_decay: 0.01
  max_steps: 20000
  warmup: 300
  val_every: 1000
  val_images: 200
  num_workers: 8
  amp: true
  grad_clip: 1.0
loss:
  type: bce_dice
  pos_weight: 10.0
  w_main: 1.0
  w_dice: 1.0
