# Hugging Face SegFormer (nvidia/mit-b2) for 1-class Bragg-peak segmentation (seg.train config).
model:
  name: hf_segformer
  pretrained: nvidia/mit-b2
  first_stride: 4      # 4 = stock (decoder at 1/4 res); 2 = decoder at 1/2 res
  pad_to: 32
  enc_lr_mult: 0.25    # pretrained encoder LR = train.lr * this
train:
  crop: 512
  batch_size: 16
  crops_per_image: 4
  pos_frac: 0.7
  lr: 3.0e-4
  weight_decay: 0.01
  max_steps: 20000
  warmup: 300
  val_every: 1000
  val_images: 200
  num_workers: 8
  amp: true
  grad_clip: 1.0
  gain_jitter: 0.2
  rot90: true
loss:
  type: focal_dice
  focal_alpha: 0.25
  focal_gamma: 2.0
  w_main: 1.0
  w_dice: 1.0
